<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Password Generator</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>Password Generator</h1>

    {% for error in errors %}
      <div class="flash flash-error">{{ error }}</div>
    {% endfor %}

    {% if password %}
    <div class="output">
      <input id="password" type="text" value="{{ password }}" readonly aria-label="Generated password" spellcheck="false" autocomplete="off">
      <button type="button" id="copy-btn">Copy</button>
    </div>
    <p id="copy-status" class="copy-status" role="status" aria-live="polite"></p>
    {% endif %}

    <form method="post" class="options">
      <div class="length-row">
        <label for="length">Length</label>
        <input type="range" id="length-slider" min="{{ min_length }}" max="{{ max_length }}" value="{{ length }}" aria-label="Password length slider">
        <input type="number" id="length" name="length" min="{{ min_length }}" max="{{ max_length }}" value="{{ length }}" required>
      </div>

      <fieldset>
        <legend>Include</legend>
        {% for name, chars in charsets.items() %}
          <label class="checkbox">
            <input type="checkbox" name="{{ name }}" {{ 'checked' if name in selected }}>
            {{ name|capitalize }} <code>{{ chars[:3] }}…</code>
          </label>
        {% endfor %}
      </fieldset>

      <button type="submit">Generate password</button>
    </form>
  </main>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
